<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뭉작가</title>
<meta name="theme-color" content="#f3ede1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1b18" media="(prefers-color-scheme: dark)">
<meta name="description" content="AI가 대신 쓰지 않는, 나만의 문체를 짓는 글쓰기 창작 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뭉작가">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#fbfaf7; --surface:#ffffff; --sunk:#f3f1ec; --ink:#1d1c1a; --ink2:#4a4741; --muted:#8e887e; --line:#ebe7df; --line2:#dcd7cc;
  --accent:#1f3a68; --accent-ink:#ffffff; --accent-soft:#e9eef7;
  --good:#3d7a57; --good-soft:rgba(61,122,87,.16); --fix:#b0573c; --fix-soft:rgba(176,87,60,.16); --ask:#1f3a68; --ask-soft:rgba(31,58,104,.13);
  --serif:'Noto Serif KR','Nanum Myeongjo',serif; --sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  /* 예전 변수 호환 */
  --paper:var(--bg); --card:var(--surface); --red:var(--accent); --red-soft:var(--accent-soft); --green:var(--good); --green-soft:var(--good-soft); --blue:var(--accent); --blue-soft:var(--accent-soft); --gold:var(--muted); --gold-soft:var(--sunk);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212; --surface:#1b1b1b; --sunk:#222; --ink:#ebe8e1; --ink2:#c3bfb6; --muted:#8a857c; --line:#2a2a2a; --line2:#3a3a3a;
  --accent:#9db7e6; --accent-ink:#0f1a2e; --accent-soft:rgba(157,183,230,.12);
  --good:#7fbf98; --good-soft:rgba(127,191,152,.18); --fix:#e0937a; --fix-soft:rgba(224,147,122,.2); --ask:#9db7e6; --ask-soft:rgba(157,183,230,.18);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 4px) 22px calc(var(--safe-b) + 96px)}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 6px}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.brand span{color:var(--ink)}
.store-chip{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.store-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--good)}
.store-chip.warn::before{background:var(--fix)}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.4px;margin:0;font-weight:700}
h2{font-size:13px;font-family:var(--sans);font-weight:500;letter-spacing:.4px;color:var(--muted);margin:30px 0 6px}
h3{font-size:17px}
.muted{color:var(--muted)} .small{font-size:13px}
.serif{font-family:var(--serif)}
.eyebrow{font-size:12px;letter-spacing:.6px;color:var(--muted)}
.eyebrow b{color:var(--accent);font-weight:500}
/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.light{background:transparent}
.btn.block{width:100%;height:46px}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:default}
.link{color:var(--accent);font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;gap:4px}
.link.mute{color:var(--muted);font-weight:400}
/* 공통 블록 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.card.tight{padding:12px 14px}
.note{font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:10px;padding:11px 13px;margin:10px 0;line-height:1.6}
.note a{font-weight:500}
.rows{border-top:1px solid var(--line)}
.row-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line);background:none}
.row-item .grow{flex:1;min-width:0}
.row-item .t{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .m{font-size:12.5px;color:var(--muted);margin-top:1px}
.row-item .chev{color:var(--line2)}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);background:none;border-radius:0}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .sub{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.tag::after{content:' ·'}
.tag.plain::after{content:''}
.empty{text-align:center;padding:36px 12px;color:var(--muted);font-size:14px}
.empty .big{font-family:var(--serif);font-size:17px;color:var(--ink2);margin-bottom:4px}
.seg{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:6px 0 4px}
.seg button{padding:10px 0;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:block;margin:12px 0}
.field > span{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;background:var(--surface);outline:none}
.field textarea{font-family:var(--serif);font-size:16px;min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.prog,.bar{height:3px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.prog i,.bar i{display:block;height:100%;background:var(--accent)}
.back{color:var(--muted);font-size:14px;padding:8px 0;display:inline-flex;align-items:center;gap:2px}
.loading{display:flex;align-items:center;gap:12px;padding:16px 0;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:80;max-width:88vw;animation:fade .2s;text-align:center}
/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 22px calc(var(--safe-b) + 22px);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 16px}
.sheet h3{font-size:19px;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);background:none}
.opt .ic{display:none}
.opt .mono{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-size:14px;flex:0 0 36px;color:var(--ink2)}
.opt b{display:block;font-weight:500}
.opt span{font-size:13px;color:var(--muted)}
/* 하단 탭 */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 calc(var(--safe-b) + 6px);z-index:20}
nav.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0}
nav.bottom a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav.bottom a.on{color:var(--ink)}
body.editing nav.bottom,body.editing header.top{display:none}
.fab{position:fixed;right:max(22px,calc(50% - 298px));bottom:calc(var(--safe-b) + 80px);width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:15}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.weave-bar{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 80px);display:flex;justify-content:center;pointer-events:none;z-index:16}
.weave-bar[hidden]{display:none}
.weave-bar .btn{pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* 오늘 */
.today{padding:26px 0 8px}
.today .date{font-size:13px;color:var(--muted)}
.today .task{font-family:var(--serif);font-size:23px;line-height:1.55;letter-spacing:-.4px;margin:14px 0 20px;font-weight:500}
.today .acts{display:flex;gap:18px;align-items:center}
.week{display:flex;align-items:center;gap:14px;margin:26px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.week .dots{display:flex;gap:9px}
.week .d{width:24px;text-align:center;font-size:11px;color:var(--muted)}
.week .d i{display:block;width:7px;height:7px;border-radius:50%;margin:0 auto 4px;background:var(--line2)}
.week .d.on i{background:var(--accent)}
.week .d.now{color:var(--ink);font-weight:700}
.week .d.now i{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.week .sum{margin-left:auto;font-size:12.5px;color:var(--muted)}
/* 배우기 경로 */
.path{position:relative;margin:8px 0 4px;padding-left:4px}
.path-course{margin:26px 0 6px}
.path-course .eyebrow{display:block}
.path-course h3{font-size:18px;margin-top:2px}
.path-course .desc{font-size:13px;color:var(--muted)}
.node{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:11px 0;position:relative}
.node .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);background:var(--bg);flex:0 0 22px;position:relative;z-index:1;display:grid;place-items:center}
.node.done .dot{background:var(--accent);border-color:var(--accent)}
.node.done .dot::after{content:'';width:8px;height:4px;border-left:1.6px solid var(--accent-ink);border-bottom:1.6px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.node.next .dot{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.node:not(:last-child)::before{content:'';position:absolute;left:10.5px;top:33px;bottom:-11px;width:1px;background:var(--line2)}
.node .t{font-family:var(--serif);font-size:15.5px}
.node.next .t{font-weight:700}
.node .m{font-size:12px;color:var(--muted)}
/* 레슨 */
.lesson h1{font-size:27px;line-height:1.35;margin:10px 0 18px}
.lesson .lead{font-family:var(--serif);font-size:16.5px;line-height:1.85;color:var(--ink)}
.lesson ol.pts{list-style:none;padding:0;margin:18px 0;counter-reset:p;border-top:1px solid var(--line)}
.lesson ol.pts li{counter-increment:p;padding:12px 0 12px 32px;border-bottom:1px solid var(--line);position:relative;font-size:14.5px}
.lesson ol.pts li::before{content:counter(p);position:absolute;left:0;top:12px;font-family:var(--serif);color:var(--accent);font-weight:700}
.ex{display:grid;gap:14px;margin:20px 0}
.ex .b,.ex .a{font-family:var(--serif);white-space:pre-line;font-size:16px;padding-left:14px;border-left:2px solid var(--line2);color:var(--muted)}
.ex .a{border-color:var(--accent);color:var(--ink)}
.ex small{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:.4px;margin-bottom:2px;color:var(--muted)}
.task-q{font-family:var(--serif);font-size:17px;line-height:1.75;padding:18px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin:8px 0 14px;white-space:pre-line}
/* 에디터 */
.ed-bar{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:6px;height:52px;margin:0 -22px;padding:calc(var(--safe-t)) 14px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ed-bar .ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink2)}
.ed-bar .ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ed-bar .mid{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.ed-bar .timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent);font-weight:500;padding:6px 8px;border-radius:8px}
.ed-ref{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:13px;color:var(--muted);padding:10px 0;border-bottom:1px solid var(--line)}
.ed-ref b{color:var(--accent);font-weight:500;flex:0 0 auto}
.ed-ref span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-title{width:100%;border:0;background:transparent;font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.4px;padding:22px 0 8px;outline:none}
.ed-title::placeholder,.ed-body::placeholder{color:var(--line2)}
.ed-wrap{position:relative}
.ed-body,.ed-back{font-family:var(--serif);font-size:17.5px;line-height:1.95;letter-spacing:-.1px;padding:6px 0 40vh;margin:0;border:0;width:100%;white-space:pre-wrap;overflow-wrap:break-word;word-break:keep-all}
.ed-body{display:block;position:relative;z-index:1;background:transparent;resize:none;outline:none;overflow:hidden;min-height:50vh;caret-color:var(--accent)}
.ed-back{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}
.ed-back mark{color:transparent;border-radius:2px;background:none}
.ed-back mark.good{background:linear-gradient(transparent 72%,var(--good-soft) 72%);box-shadow:inset 0 -2px 0 var(--good)}
.ed-back mark.fix{background:linear-gradient(transparent 72%,var(--fix-soft) 72%);box-shadow:inset 0 -2px 0 var(--fix)}
.ed-back mark.ask{box-shadow:inset 0 -2px 0 var(--ask);background:linear-gradient(transparent 72%,var(--ask-soft) 72%)}
.ed-back mark.abs{background:linear-gradient(transparent 80%,var(--fix-soft) 80%)}
.ed-back mark.on{background:var(--accent-soft)}
.ed-tools{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(var(--safe-b) + 6px)}
.ed-tools .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:2px}
.ed-tools .cnt{font-size:12px;color:var(--muted);padding:0 8px;min-width:64px;font-variant-numeric:tabular-nums}
.ed-tools .sv{font-size:11px;color:var(--muted);display:block}
.ed-tools button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);padding:4px 0;border-radius:10px}
.ed-tools button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ed-tools button.acc{color:var(--accent);font-weight:700}
.ed-tools button .badge{min-width:16px;height:16px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:16px;padding:0 4px;position:absolute;margin:-4px 0 0 18px}
.ed-comment{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 64px);z-index:24;padding:0 14px;animation:up .18s ease-out}
.ed-comment .in{max-width:612px;margin:0 auto;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:13px 15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.ed-comment .k{font-size:11.5px;letter-spacing:.4px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.ed-comment .k.good{color:var(--good)} .ed-comment .k.fix{color:var(--fix)} .ed-comment .k.ask{color:var(--ask)} .ed-comment .k.abs{color:var(--fix)}
.ed-comment p{margin:6px 0 0;font-size:14px;line-height:1.6}
.ed-comment .dir{color:var(--ink2);font-size:13.5px;margin-top:6px;padding-left:10px;border-left:2px solid var(--line2)}
.ed-status{font-size:13px;color:var(--muted)}
/* 피드백·협동 패널 */
.fb{border-top:1px solid var(--line);padding:4px 0}
.fb-head{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 0;background:none}
.fb-head b{font-weight:500}
.fb-body{padding:0 0 14px}
.fb-sec{margin-top:14px}
.fb-sec > b{font-size:11.5px;letter-spacing:.5px;display:block;margin-bottom:6px;font-weight:700}
.fb-sec.good > b{color:var(--good)} .fb-sec.q > b{color:var(--accent)} .fb-sec.fix > b{color:var(--fix)}
.quote{font-family:var(--serif);padding:0 0 0 10px;border-left:2px solid var(--line2);margin:6px 0 4px;color:var(--ink2);cursor:pointer}
.fb-item{margin:8px 0 12px;font-size:14px}
.mission{border-top:1px solid var(--ink);padding:12px 0 2px;margin-top:16px;font-family:var(--serif);font-size:15.5px}
.mission b{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:.5px;color:var(--accent);margin-bottom:4px}
table.rub{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
table.rub td{border-top:1px solid var(--line);padding:8px 2px;vertical-align:top}
table.rub td.s{white-space:nowrap;font-weight:700;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.turn{display:flex;gap:12px;margin:14px 0;align-items:flex-start}
.turn .av{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:0 0 26px;color:var(--muted);font-family:var(--serif)}
.turn .bub{flex:1;font-size:14.5px}
.turn .kind{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.4px}
.turn.me .kind{color:var(--muted)}
.turn.me .bub{color:var(--muted)}
.tools{border-top:1px solid var(--line);padding:12px 0;margin:6px 0}
.tools > b{font-size:11.5px;color:var(--muted);letter-spacing:.5px;display:block;margin-bottom:4px;font-weight:500}
.tools .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools input,.tools textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:14px;outline:none}
.tools textarea{min-height:56px;resize:vertical}
.tools label{display:block;margin:8px 0}
.tools label span{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.hl{color:var(--fix);font-size:13px;margin-right:8px}
.ref{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}

const LS_KEY='writing-app.v2';
const COLS=['writings','quotes','ideas','projects'];
const Store = {
  mode:'memory', base:null, q:{},
  async init(){
    let db=null, user=null, id=null;
    try{ if(window.claude && typeof claude.use==='function'){ [db,user]=await Promise.all([claude.use('db'),claude.use('user')]); if(user) id=await user.id(); } }catch(e){}
    if(db && id){ this.mode='db'; this.base=db.doc('data/users/'+id+'/profile'); return; }
    try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); this.mode='local'; }catch(e){ this.mode='memory'; }
  },
  async load(){
    if(this.mode==='db'){
      try{
        const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
        const [p,...cs]=await Promise.race([Promise.all([this.base.get(), ...COLS.map(c=>this.base.collection(c).get())]), timeout]);
        S.profile = p.exists ? {...defaultProfile(), ...structuredClone(p.data())} : defaultProfile();
        cs.forEach((snap,i)=>snap.docs.forEach(d=>{ if(d.exists) S[COLS[i]][d.id]=structuredClone(d.data()); }));
        return;
      }catch(e){ this.mode='local'; this.failed=true; }
    }
    if(this.mode==='local'){ try{ const r=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(r){ S.profile={...defaultProfile(),...r.profile}; COLS.forEach(c=>S[c]=r[c]||{}); } }catch(e){} }
    if(!S.profile) S.profile=defaultProfile();
  },
  _local(){ if(this.mode!=='local') return; try{ localStorage.setItem(LS_KEY, JSON.stringify({profile:S.profile, writings:S.writings, quotes:S.quotes, ideas:S.ideas, projects:S.projects})); }catch(e){ toast('기기 저장 공간이 부족해요'); } },
  _chain(key, fn){
    const prev=this.q[key]||Promise.resolve();
    const next=prev.catch(()=>{}).then(fn).catch(e=>{
      if(e&&e.code==='quota_exceeded') toast('저장 공간이 가득 찼어요. 오래된 글을 정리해 주세요.');
      else if(e&&e.code==='unavailable') return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(fn).catch(()=>toast('저장에 실패했어요'));
      else toast('저장에 실패했어요');
      throw e;
    });
    this.q[key]=next; return next;
  },
  saveProfile(){ if(this.mode==='db') return this._chain('profile',()=>this.base.set(structuredClone(S.profile))); this._local(); return Promise.resolve(); },
  save(col, o){ if(col==='writings'){ fitDoc(o); } o=col==='writings'?Object.fromEntries(Object.entries(o).filter(([k])=>k!=='_savedBody')):o; if(this.mode==='db') return this._chain(col+o.id,()=>this.base.collection(col).doc(o.id).set(structuredClone(o))); this._local(); return Promise.resolve(); },
  del(col, id){ if(this.mode==='db') return this._chain(col+id,()=>this.base.collection(col).doc(id).delete()); this._local(); return Promise.resolve(); }
};
function byteSize(o){ try{ return new Blob([JSON.stringify(o)]).size; }catch(e){ return JSON.stringify(o).length*3; } }
function fitDoc(w){
  for(const k of ['versions','collab','feedbacks']) while(byteSize(w)>230000 && (w[k]||[]).length>1) w[k].shift();
}
function markDay(){ const d=today(), days=S.profile.days||(S.profile.days=[]); if(!days.includes(d)){ days.push(d); if(days.length>120) days.shift(); Store.saveProfile(); } }

    el.innerHTML=`<div class="small">${lines}행 · ${st}연</div><div class="small" style="margin-top:4px">관념어 점검: ${found.length?found.map(x=>`<span class="hl">${esc(x[0])} ${x[1]}</span>`).join('')+' <span class="muted">→ 이미지로 바꿀 수 있을까요?</span>':'<span class="muted">감정을 직접 말하는 단어가 없어요 👍</span>'}</div>`;
  } else if(w.genre==='novel'){
    const dl=b.split('\n').filter(x=>/^\s*["“]/.test(x)).join('').length; el.textContent=`대사 비율 ${b.length?Math.round(dl/b.length*100):0}% · 문단 ${b.split(/\n+/).filter(x=>x.trim()).length}개`;
  } else if(w.genre==='essay'){
    const sents=b.split(/[.!?。]\s*/).filter(x=>x.trim()); const avg=sents.length?Math.round(charsNoSp(b)/sents.length):0;
    el.textContent=`문장 ${sents.length}개 · 평균 ${avg}자 ${avg>45?'(긴 문장이 많아요. 나눠 볼까요?)':''}`;
  } else if(w.genre==='script'){
    el.textContent=`장면 ${(b.match(/^S#/gm)||[]).length}개 · 대사 ${(b.match(/^[^\n:]{1,10}:/gm)||[]).length}줄`;
  } else if(w.genre==='argument'){
    const tgt=+(w.meta?.target)||(w.problemId?PROBLEM_MAP[w.problemId].target:1000); const n=charsNoSp(b); const pct=Math.min(100,Math.round(n/tgt*100));
    const conds=(w.meta?.conds||'').split('\n').map(x=>x.trim()).filter(Boolean); const chk=w.meta?.chk||{};
    el.innerHTML=`<div class="small" style="margin-top:6px">분량 ${n} / ${tgt}자 (${pct}%) ${n>tgt*1.1?'<span style="color:var(--red)">· 10% 넘게 초과</span>':''}</div><div class="prog"><i style="width:${pct}%"></i></div>
    ${conds.length?`<div class="small" style="margin-top:8px">조건 확인</div>${conds.map((c,i)=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-chk="${i}" ${chk[i]?'checked':''} style="width:auto"> <span style="font-size:14px;color:var(--ink)">${esc(c)}</span></label>`).join('')}`:''}`;
    el.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{ w.meta.chk={...(w.meta.chk||{}),[c.dataset.chk]:c.checked}; S.metaDirty=true; S.sched&&S.sched(); });
  }
}

function contextOf(w){
  const L=w.lessonId&&LESSON_MAP[w.lessonId], P=w.problemId&&PROBLEM_MAP[w.problemId], m=w.meta||{};
  let s='';
  if(L) s+=`\n[레슨 과제: ${L.title}] ${L.task}\n핵심 개념: ${L.concept}`;
  if(P) s+=`\n[${P.type} 문항] 제시문: ${P.passage}\n문제: ${P.question}`;
  if(w.prompt) s+=`\n[글감] ${w.prompt}`;
  if(w.ref) s+=`\n[작가가 책에서 수집한 문구] ${w.ref.text}`;
  const notes=Object.entries(m).filter(([k,v])=>typeof v==='string'&&v.trim()).map(([k,v])=>`${k}: ${v}`).join(' / ');
  if(notes) s+=`\n[작가의 설계 메모] ${notes}`;
  return s;
}

async function collabTurn(w,v){
  if(S.busy) return; if(charsNoSp(w.body)<10) return toast('먼저 몇 문장 써 주세요. 그다음 AI 동료가 이어받아요.');
  const lastMe=[...(w.collab||[])].reverse().find(t=>t.role==='me');
  if(lastMe && lastMe.chars===charsNoSp(w.body)) return toast('AI 동료의 질문을 보고 조금 더 써 본 뒤 다시 넘겨 주세요');
  S.busy=true; const area=$('[data-area]',v); area.innerHTML=loadingHTML('AI 동료가 읽는 중…'); area.scrollIntoView({block:'center'});
  const newPart = lastMe ? w.body.slice(lastMe.len||0) : w.body;
  const history=(w.collab||[]).filter(t=>t.role==='ai').slice(-4).map(t=>`- (${t.kind}) ${t.text}`).join('\n');
  const prompt=`당신은 ${GENRES[w.genre]?.name} 글을 함께 쓰는 "협동 글쓰기 동료"입니다. 작가와 번갈아 턴을 주고받습니다. 작가가 한 턴을 쓰고 넘기면, 당신은 문장을 쓰는 대신 작가가 다음 턴을 스스로 쓰도록 돕는 한 가지를 건넵니다.
${NO_GHOSTWRITE}
- 이번 턴에서 할 것은 셋 중 하나만 고르세요: "질문"(다음 내용을 떠올리게 하는 질문), "방향"(이야기·논리를 어디로 끌고 갈지 선택지 2개 제시), "독자 반응"(지금까지 읽은 독자가 느낀 것과 궁금한 것).
- 작가의 문체(문장 길이, 어휘, 리듬)를 관찰하고, 그 문체를 지키는 쪽으로 도우세요. 문체를 바꾸라고 하지 마세요.${styleContext()}
${contextOf(w)}
${history?`[이전 턴에서 당신이 건넨 것]\n${history}`:''}
[작가가 지금까지 쓴 전체 글]
"""
${w.body.slice(-5000)}
"""
[이번 턴에 새로 쓴 부분]
"""
${newPart.slice(-2000)}
"""
JSON으로만 답하세요: {"kind":"질문|방향|독자 반응","focus":"새로 쓴 부분에서 주목한 원문 구절(30자 이내, 없으면 빈 문자열)","text":"작가에게 건넬 말 2~3문장","next":"다음 턴에 작가가 써 볼 것 한 줄(문장 예시 금지)"}`;
  try{
    const d=await askAI(prompt,{tier:'quick',nocache:true});
    const ex=newPart.trim(); (w.collab||(w.collab=[])).push({role:'me', at:Date.now(), chars:charsNoSp(w.body), len:w.body.length, excerpt: ex.length>80? '… '+ex.slice(-80):ex});
    w.collab.push({role:'ai', at:Date.now(), kind:d.kind, focus:d.focus, text:d.text, next:d.next});
    if(w.collab.length>40) w.collab.splice(0,2);
    w.updatedAt=Date.now(); await Store.save('writings',w).catch(()=>{}); S.busy=false; render();
    setTimeout(()=>{ const ts=document.querySelectorAll('.collab .turn'); ts.length&&ts[ts.length-1].scrollIntoView({block:'center',behavior:'smooth'}); },50);
  }catch(e){ S.busy=false; area.innerHTML=`${aiNoteHTML(e)}`; }
}

async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const sc=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.85));
  }catch(e){ return file; } finally{ URL.revokeObjectURL(url); }
}

function projWritings(p){ return Object.values(S.writings).filter(w=>w.projectId===p.id).sort((a,b)=>a.createdAt-b.createdAt); }
function projProgress(p){
  const c=CONTEST[p.genre]; const ws=projWritings(p);
  if(p.genre==='poem'){ const n=ws.filter(w=>w.final).length; return {n, t:c.target, pct:Math.min(100,Math.round(n/c.target*100)), label:`완성 시 ${n}/${c.target}편`}; }
  const d=p.draftId&&S.writings[p.draftId]; const n=d?charsNoSp(d.body):ws.reduce((a,w)=>a+charsNoSp(w.body),0);

function projStage(p){

const TABS4=['home','write','learn','me'];

function go(tab, sub, seg){
  if(tab==='insp'){ S.seg.write='drawer'; if(seg) S.seg.insp=seg; }
  else if(tab==='exam'){ S.seg.learn='exam'; }
  else if(seg) S.seg[tab]=seg;

function render(){
  const v=$('#view'); clearTimers(); $('#weaveBar').hidden=true; document.body.classList.remove('editing'); $('#fab').hidden=true; $('#edTools').hidden=true; hideComment(); if(!AI_CTL||AI_CTL.signal.aborted||!$('#aiPanel .spin')) { if(!S.keepPanel) aiPanel(null); }

    else if(S.sub&&S.sub.startsWith('p:')&&S.projects[S.sub.slice(2)]){ const p=S.projects[S.sub.slice(2)]; v.innerHTML=projectHTML(p); bindProject(v,p); }

}

function computeMarks(w, body){

  if(f){ const P=PERSONAS[f.persona]||{name:'AI'}; const d=f.data||{};
    (d.improvements||[]).forEach(x=>add(x.quote,'fix',{label:`${P.name} · 다듬어 볼 곳`, text:x.issue, dir:x.direction}));
    (d.strengths||[]).forEach(x=>add(x.quote,'good',{label:`${P.name} · 좋은 점`, text:x.why}));
  }
  const lastAi=[...(w.collab||[])].reverse().find(t=>t.role==='ai');
  if(lastAi&&lastAi.focus) add(lastAi.focus,'ask',{label:`AI 동료 · ${lastAi.kind||'질문'}`, text:lastAi.text, dir:lastAi.next});

const BYOK_FALLBACK={gemini:'gemini-3.5-flash-lite', claude:'claude-haiku-5-5'};

function aiLogGet(){ try{ return JSON.parse(localStorage.getItem('mjk.ailog')||'[]'); }catch(_){ return []; } }

document.addEventListener('visibilitychange',()=>{ if(document.hidden&&AI_CTL&&!AI_CTL.signal.aborted&&$('#aiPanel .spin')) AI_HIDDEN_DURING=true; });
function classify(status, body){
  const m=String((body&&body.error&&(body.error.message||body.error.type||body.error.status))||'');
  const t=String((body&&body.error&&body.error.type)||'');
  if(status===401||status===403||/API key not valid|invalid x-api-key|authentication|API_KEY_INVALID|permission/i.test(m)) return {code:'bad_key',status,message:m};
  if(status===402||/credit balance|billing|insufficient/i.test(m)) return {code:'no_credit',status,message:m};
  if(status===404||(status===400&&/model/i.test(m)&&/not found|not supported|unknown/i.test(m))) return {code:'bad_model',status,message:m};
  if(status===429){ if(/per day|daily|PerDay|exhausted|quota/i.test(m)&&!/per minute|PerMinute/i.test(m)) return {code:'quota_day',status,message:m}; return {code:'busy',status,message:m}; }
  if(status>=500||status===529||/overloaded|UNAVAILABLE|high demand/i.test(m+t)) return {code:'busy',status,message:m};
  if(status===400&&/safety|blocked/i.test(m)) return {code:'refused',status,message:m};
  return {code:'upstream_error',status,message:m||('HTTP '+status)};
}
async function readSSE(res, onData, idleMs, ctl){
  const rd=res.body.getReader(); const dec=new TextDecoder(); let buf=''; let timer;
  const arm=()=>{ clearTimeout(timer); timer=setTimeout(()=>{ ctl.idle=true; ctl.abort(); }, idleMs); };
  arm();
  try{ for(;;){ const {done,value}=await rd.read(); if(done) break; arm(); buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).replace(/\r$/,''); buf=buf.slice(i+1); if(line.startsWith('data:')){ const d=line.slice(5).trim(); if(d&&d!=='[DONE]'){ try{ onData(JSON.parse(d)); }catch(e){ if(e&&e.code) throw e; } } } } }
  } finally { clearTimeout(timer); }
}

async function pinHash(pin){ const t='mjk-pin:'+pin; try{ const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(_){ let h=0; for(const ch of t) h=(h*31+ch.charCodeAt(0))|0; return 'x'+h; } }
function pinOn(){ try{ return !!localStorage.getItem('mjk.pin'); }catch(_){ return false; } }
function pinLocked(){ return pinOn()&&!(S.pinOkUntil>Date.now()); }
function askPin(onOk){
  sheet(`<h3>잠금 해제</h3><p class="small muted">AI 연결 화면은 비밀번호로 잠겨 있어요.</p>
    <label class="field"><span>4자리 비밀번호</span><input data-pin type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="font-size:22px;letter-spacing:10px;text-align:center"></label>
    <div data-msg class="small" style="color:var(--fix);min-height:20px"></div>
    <button class="btn primary block" data-ok>확인</button>
    <button class="btn ghost block" data-forgot style="margin-top:6px">비밀번호를 잊었어요</button>`,
  (el,close)=>{ const i=$('[data-pin]',el); setTimeout(()=>i.focus(),50);
    const go=async()=>{ let stored=''; try{ stored=localStorage.getItem('mjk.pin')||''; }catch(_){}
      if(await pinHash(i.value)===stored){ S.pinOkUntil=Date.now()+5*60e3; close(); onOk(); } else { $('[data-msg]',el).textContent='비밀번호가 달라요'; i.value=''; } };
    $('[data-ok]',el).onclick=go; i.oninput=()=>{ if(i.value.length===4) go(); }; i.onkeydown=e=>{ if(e.key==='Enter') go(); }; // [수정] 폰 키보드는 keyup이 안 올 때가 있어 input으로
    $('[data-forgot]',el).onclick=()=>{ close(); confirmSheet('잠금을 풀려면 저장된 API 키도 함께 지워야 해요. 지울까요? (키는 platform.claude.com이나 구글에서 새로 만들 수 있어요)','키 지우고 잠금 풀기',()=>{ byokSet(null); try{ localStorage.removeItem('mjk.pin'); }catch(_){} toast('키와 잠금을 지웠어요'); render(); }); };
  });
}
function pinSetupSheet(){
  if(pinLocked()) return askPin(pinSetupSheet);
  sheet(`<h3>${pinOn()?'잠금 비밀번호 바꾸기':'AI 연결 잠그기'}</h3><p class="small muted">키를 보거나 바꾸거나 상한을 바꿀 때 이 비밀번호를 물어요. 한 번 풀면 5분 동안은 다시 묻지 않아요.</p>
    <label class="field"><span>새 4자리 비밀번호</span><input data-p1 type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="font-size:22px;letter-spacing:10px;text-align:center"></label>
    <label class="field"><span>한 번 더</span><input data-p2 type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="font-size:22px;letter-spacing:10px;text-align:center"></label>
    <div data-msg class="small" style="color:var(--fix);min-height:20px"></div>
    <button class="btn primary block" data-ok>저장</button>${pinOn()?'<button class="btn ghost block" data-off style="margin-top:6px">잠금 끄기</button>':''}`,
  (el,close)=>{ $('[data-ok]',el).onclick=async()=>{ const a=$('[data-p1]',el).value, b=$('[data-p2]',el).value;
      if(!/^\d{4}$/.test(a)) return $('[data-msg]',el).textContent='숫자 4자리로 넣어 주세요';
      if(a!==b) return $('[data-msg]',el).textContent='두 번 넣은 숫자가 달라요';
      try{ localStorage.setItem('mjk.pin',await pinHash(a)); }catch(_){} S.pinOkUntil=Date.now()+5*60e3; close(); toast('AI 연결을 잠갔어요'); render(); };
    const off=$('[data-off]',el); if(off) off.onclick=()=>{ try{ localStorage.removeItem('mjk.pin'); }catch(_){} close(); toast('잠금을 껐어요'); render(); }; });
}

function byokAdapter(cfg){
  const once=async(prompt,o,model,imgs)=>{
    const text=prompt+'\n\n(반드시 JSON만 출력하세요.)';
    const ctl=new AbortController(); const outer=o.signal; const onAbort=()=>ctl.abort(); if(outer){ if(outer.aborted) throw {code:'cancelled'}; outer.addEventListener('abort',onAbort); }
    let out='', res; let tin=0, tout=0; // [추가] 사용량(토큰)
    try{
      if(cfg.provider==='gemini'){
        res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,{method:'POST',signal:ctl.signal,
          headers:{'content-type':'application/json','x-goog-api-key':cfg.key},
          body:JSON.stringify({contents:[{role:'user',parts:[...imgs.map(i=>({inline_data:{mime_type:i.type,data:i.data}})),{text}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:16384}})});
        if(!res.ok){ let j=null; try{ j=await res.json(); }catch(_){ } throw classify(res.status,Array.isArray(j)?j[0]:j); }
        let finish='';
        await readSSE(res,d=>{ if(d.error) throw classify(d.error.code||500,{error:d.error}); if(d.usageMetadata){ tin=d.usageMetadata.promptTokenCount||tin; tout=(d.usageMetadata.candidatesTokenCount||0)+(d.usageMetadata.thoughtsTokenCount||0)||tout; } const c=(d.candidates||[])[0]; if(!c) return; if(c.finishReason) finish=c.finishReason;
          const add=((c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join(''); if(add){ out+=add; o.onText&&o.onText({text:out,delta:add}); } }, 100000, ctl);
        if(!out.trim()&&finish==='SAFETY') throw {code:'refused'};
      } else {
        res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctl.signal,
          headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model,max_tokens:4096,stream:true,messages:[{role:'user',content:[...imgs.map(i=>({type:'image',source:{type:'base64',media_type:i.type,data:i.data}})),{type:'text',text}]}]})});
        if(!res.ok){ let j=null; try{ j=await res.json(); }catch(_){ } throw classify(res.status,j); }
        await readSSE(res,d=>{ if(d.type==='error') throw classify(d.error&&d.error.type==='overloaded_error'?529:500,{error:d.error});
          if(d.type==='message_start'&&d.message&&d.message.usage){ tin=(d.message.usage.input_tokens||0)+(d.message.usage.cache_creation_input_tokens||0)+(d.message.usage.cache_read_input_tokens||0); tout=d.message.usage.output_tokens||0; }
          if(d.type==='message_delta'&&d.usage&&d.usage.output_tokens) tout=d.usage.output_tokens;
          if(d.type==='content_block_delta'&&d.delta&&d.delta.type==='text_delta'){ out+=d.delta.text; o.onText&&o.onText({text:out,delta:d.delta.text}); } }, 100000, ctl);
      }
    }catch(e){
      if(e&&e.code) throw e;
      if(outer&&outer.aborted) throw {code:'cancelled'};
      if(ctl.idle) throw {code:'busy',message:'응답이 오래 멈춰서 다시 시도'};
      if(!navigator.onLine) throw {code:'offline',message:'오프라인'};
      throw {code:'network',message:String(e&&e.message||e)};
    } finally { if(outer) outer.removeEventListener('abort',onAbort); if(tin||tout) usageAdd(cfg.provider, model, tin, tout||Math.ceil(out.length/1.5)); } // [추가] 받은 만큼 기록
    if(!out.trim()) throw {code:'empty_completion'};
    return out;
  };
  const call=async(prompt,o={})=>{
    const imgs=o.images?await Promise.all([].concat(o.images).map(blobB64)):[];
    const tier=o.modelTier||'default';
    const main=(cfg.model&&cfg.model.trim())||(tier==='quick'?BYOK_QUICK:BYOK_DEF)[cfg.provider];
    const fb=BYOK_FALLBACK[cfg.provider];
    const delays=[1500,4000,8000];
    { const b=budgetGet(), u=usageGet(); if(cfg.provider==='claude'&&b.on&&u.usd>=b.usd) throw {code:'budget'}; } // [추가] 한 달 상한
    for(let i=0;;i++){
      const model=(i>=2&&fb&&fb!==main)?fb:main;
      try{ const out=await once(prompt,o,model,imgs); S.aiRetry=0; return {text:out,truncated:false,model}; }
      catch(e){
        aiLog(e,{prov:cfg.provider,model,try:i+1});
        const retryable=['busy','network','empty_completion'].includes(e.code)&&!(o.signal&&o.signal.aborted);
        if(!retryable||i>=delays.length){ S.aiRetry=0; throw e; }
        S.aiRetry=i+1; S.aiRetryWhy=e.code; await sleep(delays[i]);
        while(document.hidden) await sleep(500);
      }
    }
  };
  const fn=(p,o)=>call(p,o);
  fn.json=async(p,o)=>{ for(let k=0;k<2;k++){ const r=await call(p,o); try{ return parseJSON(r.text); }catch(e){ aiLog({code:'invalid_json',message:r.text.slice(0,120)},{prov:cfg.provider}); if(k===1) throw {code:'invalid_json',text:r.text}; } } };
  fn.limits=async()=>({maxPromptBytes:262144, images:{maxCount:5}});
  fn.byok=cfg.provider;
  return fn;
}

// [수정] 덧씌우던 askAI를 정식 함수로 바꿈
async function askAI(prompt,opts={}){
  let wl=null; try{ if(navigator.wakeLock) wl=await navigator.wakeLock.request('screen'); }catch(_){}
  AI_HIDDEN_DURING=false; S.aiRetry=0;
  const rt=setInterval(()=>{ const p=$('#aiPanel .in > div.small.muted'); if(p&&S.aiRetry) p.textContent=`서버가 바빠서 다시 연결하는 중이에요 (${S.aiRetry}/3)${S.aiRetry>=2?' · 예비 모델로 시도':''}`; else if(p&&!S.aiRetry&&IS_PAGES) p.textContent='답이 올 때까지 이 화면을 켜 두세요. 보통 10~40초 걸려요.'; },500);
  try{ return await askAIRun(prompt,opts); }
  finally{ clearInterval(rt); try{ wl&&wl.release(); }catch(_){} }
}

/* ============ 시작 ============ */
(async function start(){
  await Store.init(); await Store.load();
  { const sc=$('#storeChip'); sc.textContent = Store.mode==='db'?'계정에 저장':Store.mode==='local'?(Store.failed?'이 기기에 임시 저장':'이 기기에 저장'):'저장 안 됨'; sc.classList.toggle('warn', Store.mode!=='db'&&(!!Store.failed||Store.mode==='memory')); }
  applyAppName(); if(navigator.serviceWorker) navigator.serviceWorker.addEventListener('controllerchange',applyAppName);
  S.tab=null; route(); getAI();
  if(!S.profile.onboard) setTimeout(()=>showOnboarding(),300);
  else if(!S.profile.penName) setTimeout(()=>penNameSheet(),300);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.editorCommit&&S.tab==='write'&&S.sub) S.editorCommit(); });
})();

</script>
